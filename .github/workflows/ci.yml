name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests examples
      - name: Tests
        run: pytest --cov=agentsim --cov-report=term-missing
      - name: Replay fixture smoke
        run: |
          agentsim run --seed 0 --contracts examples/contracts.json --record /tmp/traj.json
          agentsim run --seed 0 --replay /tmp/traj.json --contracts examples/contracts.json
