[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentsim"
version = "0.1.0"
description = "Deterministic seeded fault simulation for tool-using AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Aryan Daga", email = "aryand@andrew.cmu.edu" },
]
keywords = [
  "agents",
  "simulation",
  "fault-injection",
  "chaos",
  "replay",
  "contracts",
  "testing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
agentsim = "agentsim.cli.main:cli"

[project.urls]
Homepage = "https://github.com/aryand2006/agentsim"
Repository = "https://github.com/aryand2006/agentsim"
Issues = "https://github.com/aryand2006/agentsim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsim"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentsim"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
